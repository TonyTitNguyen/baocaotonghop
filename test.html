<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Test API — Local & Vercel</title>
    <style>
        body { font-family: sans-serif; padding: 40px; max-width: 860px; background: #f7f5f2; }
        h2 { color: #2A3B00; margin-bottom: 4px; }
        .env-toggle { display: flex; gap: 0; margin-bottom: 20px; border-radius: 10px; overflow: hidden; border: 2px solid #2A3B00; width: fit-content; }
        .env-btn { padding: 9px 22px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; background: #fff; color: #555; transition: all .2s; }
        .env-btn.active { background: #2A3B00; color: #fff; }
        .env-btn:first-child { border-right: 2px solid #2A3B00; }
        .endpoint-url { font-family: monospace; font-size: 12px; color: #888; margin-bottom: 18px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 8px 14px; }
        .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
        input, select { padding: 8px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 8px; }
        button { padding: 10px 20px; font-size: 14px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; }
        .btn-data { background: #435E01; color: white; }
        .btn-chat { background: #D4AF37; color: #2A3B00; }
        .btn-data:hover { background: #2A3B00; }
        .btn-chat:hover { background: #c09b20; }
        #status { margin-top: 16px; font-weight: bold; font-size: 15px; }
        #output { margin-top: 16px; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; white-space: pre-wrap; font-size: 13px; font-family: monospace; max-height: 400px; overflow-y: auto; display: none; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 6px; }
        .tag-ok { background: #d1fae5; color: #065f46; }
        .tag-err { background: #fee2e2; color: #991b1b; }
        .tag-info { background: #dbeafe; color: #1e40af; }
        .warning-local { background: #fff7ed; border: 1px solid #fb923c; color: #9a3412; border-radius: 8px; padding: 8px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
    </style>
</head>

<body>
    <h2>🔧 API Tester</h2>
    <p style="color:#888;margin-bottom:16px;font-size:13px">Chọn endpoint để test — có thể test Local hoặc Vercel bất kể đang mở ở đâu</p>

    <!-- Endpoint Toggle -->
    <div class="env-toggle">
        <button class="env-btn" id="btn-local" onclick="setEndpoint('local')">🖥️ Local (3001)</button>
        <button class="env-btn" id="btn-vercel" onclick="setEndpoint('vercel')">☁️ Vercel</button>
    </div>

    <!-- Current URL preview -->
    <div class="endpoint-url" id="urlPreview"></div>

    <!-- Warning if picking Local from a non-localhost context -->
    <div class="warning-local" id="localWarning">
        ⚠️ Bạn đang mở file này từ xa nhưng chọn Local server — hãy chạy <code>node api/local-server.js</code> trên máy và mở qua <code>http://localhost:8080/test.html</code>
    </div>

    <div class="controls">
        <select id="monthInput">
            <option value="1">Tháng 1</option><option value="2">Tháng 2</option>
            <option value="3" selected>Tháng 3</option><option value="4">Tháng 4</option>
            <option value="5">Tháng 5</option><option value="6">Tháng 6</option>
            <option value="7">Tháng 7</option><option value="8">Tháng 8</option>
            <option value="9">Tháng 9</option><option value="10">Tháng 10</option>
            <option value="11">Tháng 11</option><option value="12">Tháng 12</option>
        </select>
        <input id="yearInput" type="number" value="2026" min="2024" max="2030" style="width:90px">
        <button class="btn-data" onclick="testDataFetch()">📊 Test Data Fetch</button>
        <input id="chatInput" type="text" placeholder="Nhập câu hỏi AI..." style="width:240px">
        <button class="btn-chat" onclick="testAIChat()">🤖 Test AI Chat</button>
    </div>

    <div id="status"></div>
    <div id="output"></div>

    <script>
        const ENDPOINTS = {
            local:  'http://localhost:3001/api',
            vercel: 'https://baocaotonghop-lake.vercel.app/api'
        };

        // Auto-detect default: localhost → local, otherwise → vercel
        const _isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        let activeEndpoint = _isLocal ? 'local' : 'vercel';

        function setEndpoint(key) {
            activeEndpoint = key;
            document.getElementById('btn-local').classList.toggle('active', key === 'local');
            document.getElementById('btn-vercel').classList.toggle('active', key === 'vercel');
            document.getElementById('urlPreview').textContent = `Endpoint: ${ENDPOINTS[key]}`;
            // Show warning if picking local while not on localhost
            const showWarn = key === 'local' && !_isLocal;
            document.getElementById('localWarning').style.display = showWarn ? 'block' : 'none';
            // Reset output when switching
            document.getElementById('status').innerHTML = '';
            document.getElementById('output').style.display = 'none';
        }

        // Init on load
        setEndpoint(activeEndpoint);

        function getProxyUrl() { return ENDPOINTS[activeEndpoint]; }

        function setStatus(msg, type = 'info') {
            const el = document.getElementById('status');
            const tag = type === 'ok' ? '✅ Thành công' : type === 'err' ? '❌ Lỗi' : '⏳ Đang chạy...';
            const cls = type === 'ok' ? 'tag-ok' : type === 'err' ? 'tag-err' : 'tag-info';
            el.innerHTML = `<span class="tag ${cls}">${tag}</span> ${msg}`;
        }

        function showOutput(data) {
            const el = document.getElementById('output');
            el.style.display = 'block';
            el.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        }

        async function testDataFetch() {
            const month = document.getElementById('monthInput').value;
            const year  = document.getElementById('yearInput').value;
            const url   = `${getProxyUrl()}?month=${month}&year=${year}`;

            setStatus(`Gọi: ${url}`, 'info');
            console.log('📡 Data Fetch URL:', url);

            try {
                const t0 = Date.now();
                const response = await fetch(url);
                const elapsed = Date.now() - t0;

                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);

                const data = await response.json();

                const rawCount = data.raw?.length ?? 'N/A';
                const adsCount = data.ads?.length ?? 'N/A';
                const mktCount = data.marketing?.length ?? 'N/A';

                setStatus(`Tháng ${month}/${year} — ${rawCount} dòng raw, ${adsCount} dòng ads, ${mktCount} dòng marketing (${elapsed}ms)`, 'ok');
                showOutput({ thoiGianMs: elapsed, soLieuDong: { raw: rawCount, ads: adsCount, marketing: mktCount }, cauTrucMau: { raw: data.raw?.[0], ads: data.ads?.[0] } });

                console.log('✅ DATA OK:', data);
                console.table(data.raw);
                console.table(data.ads);
            } catch (err) {
                setStatus(err.message, 'err');
                showOutput('LỖI:\n' + err.message);
                console.error('❌ Data Fetch Error:', err);
            }
        }

        async function testAIChat() {
            const month = document.getElementById('monthInput').value;
            const year  = document.getElementById('yearInput').value;
            const q     = document.getElementById('chatInput').value.trim() || `Tóm tắt doanh thu tháng ${month}/${year}`;
            const url   = `${getProxyUrl()}?action=chat&q=${encodeURIComponent(q)}&month=${month}&monthFrom=${parseInt(month) > 1 ? parseInt(month) - 1 : 12}&year=${year}`;

            setStatus(`Gọi AI: "${q}"`, 'info');
            console.log('🤖 AI Chat URL:', url);

            try {
                const t0 = Date.now();
                const response = await fetch(url);
                const elapsed = Date.now() - t0;

                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);

                const data = await response.json();
                const preview = (data.text || '').substring(0, 120) + '...';

                setStatus(`AI trả lời trong ${elapsed}ms — "${preview}"`, 'ok');
                showOutput(data.text || JSON.stringify(data, null, 2));
                console.log('✅ AI RESPONSE:', data);
            } catch (err) {
                setStatus(err.message, 'err');
                showOutput('LỖI:\n' + err.message);
                console.error('❌ AI Chat Error:', err);
            }
        }
    </script>
</body>

</html>
